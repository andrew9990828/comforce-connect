# Local API, database and staff sign-in. Contributor: OpenAI Codex (GPT-6), configuration.
project_id = "comforce-connect"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./demo_seed.sql"]

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
otp_length = 6

[auth.email.template.confirmation]
subject = "ComForce local team sign-in"
content_path = "./supabase/templates/otp.html"

[auth.email.template.magic_link]
subject = "ComForce local team sign-in"
content_path = "./supabase/templates/otp.html"

[realtime]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
